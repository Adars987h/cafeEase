spring.application.name=Cafe Management System
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Datasource - overridden by env vars in deployed environments.
# Defaults target a local MySQL so `mvn spring-boot:run` still works out of the box.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafeDb?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Managed MySQL free tiers cap concurrent connections; keep the pool small.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Render (and most PaaS) inject the port to bind on.
server.port=${PORT:8081}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Comma-separated. No trailing slashes - the browser's Origin header never has one.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# The mail starter auto-configures a MailHealthIndicator that opens an SMTP
# connection on every health poll. Hosting platforms often restrict outbound
# SMTP, which makes /actuator/health report DOWN and blocks the platform's
# health check even though the app is serving fine. Mail delivery is not a
# liveness concern, so exclude it.
management.health.mail.enabled=false

logging.level.root=INFO
