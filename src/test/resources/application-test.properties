# "test" profile: tests and local dev runs (test classpath only, never shipped in the jar).
# H2 in MySQL mode. USER and VALUE are keywords in H2 but plain table/column names here.
spring.datasource.url=jdbc:h2:mem:cafe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSON AS CLOB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-that-is-at-least-32-characters-long
app.cors.allowed-origins=http://localhost:3000
app.frontend.url=http://localhost:3000

app.seed.enabled=true
app.seed.catalogue=dev-catalogue.sql
app.seed.admin.email=admin@cafeease.test
app.seed.admin.password=admin-password-123
app.seed.admin.name=Test Admin
